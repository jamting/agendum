# The long fuzz run, nightly: the TUI fuzz property with 10,000 runs instead
# of the suite's 1,000, which finds crashes the short run misses (CLAUDE.md,
# workflow step 4), and the parsers' property tests with 2,000 inputs each
# instead of 40 (2026-10-31: CI minutes are free, the owner's time is not).
# A failure prints the command that repeats it locally, with its seed.
name: fuzz

on:
  schedule:
    - cron: "17 2 * * *" # every night, 02:17 UTC, on main
  workflow_dispatch: # and by hand: gh workflow run fuzz.yml

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      FUZZ_RUNS: "10000"
      PARSER_RUNS: "2000"
    steps:
      - uses: actions/checkout@v7

      # the same versions as check.yml
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "29"
          elixir-version: "1.20.4"

      # check.yml's cache, only read: that workflow keeps it up to date
      - uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
            ~/.mix
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      # a seed of our own, so a failure can name it; each night a new one
      - id: seed
        run: echo "seed=$(( $(date +%s) % 1000000 ))" >> "$GITHUB_OUTPUT"

      # the whole output kept in a file as well (meeting 2026-10-26-1524, § 8);
      # `pipefail` keeps the test's failure as the step's, through `tee`
      - run: |
          set -o pipefail
          mix test test/agendum/tui/fuzz_test.exs test/agendum/parsers_property_test.exs \
            --seed ${{ steps.seed.outputs.seed }} 2>&1 | tee fuzz.log

      # on a failure, the output is kept with the run, to download
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-log-${{ steps.seed.outputs.seed }}
          path: fuzz.log
          retention-days: 90

      - if: failure()
        run: |
          echo "Repeat it locally:" >> "$GITHUB_STEP_SUMMARY"
          echo '```sh' >> "$GITHUB_STEP_SUMMARY"
          echo "FUZZ_RUNS=10000 PARSER_RUNS=2000 mix test test/agendum/tui/fuzz_test.exs test/agendum/parsers_property_test.exs --seed ${{ steps.seed.outputs.seed }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
