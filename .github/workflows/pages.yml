# The public site at jamting.github.io/agendum/ (meeting 2026-10-30-2020,
# §§ 5, 8, 10): the front page (pages/), the guide, the manual, the API and
# design docs and llms.txt, put together by `mix agendum.pages`, which also
# fails on a broken link. Settings ▸ Pages ▸ Source must be "GitHub Actions".
# Every push to main publishes it; `gh workflow run pages.yml` does it by hand.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# one deployment at a time; a newer one waits rather than cancelling
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # ex_doc is a dev dependency
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: "29"
          elixir-version: "1.20.4"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: pages-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix docs
      - run: mix agendum.pages

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _build/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1