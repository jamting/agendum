# The public site at jamting.github.io/agendum/ (meeting 2026-10-30-2020,
# §§ 5, 8, 10): the front page (pages/), the guide, the manual, the API and
# design docs and llms.txt, put together by `mix agendum.pages`, which also
# fails on a broken link. Settings ▸ Pages ▸ Source must be "GitHub Actions".
#
# Started by hand for now (`gh workflow run pages.yml`): the site goes up
# once the devlog has its first post (the roadmap's step 6, which then adds
# `push: branches: [main]` here so every push to main publishes it).
name: pages

on:
  workflow_dispatch:

# one deployment at a time; a newer one waits rather than cancelling
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # ex_doc is a dev dependency
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "29"
          elixir-version: "1.20.4"

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: pages-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix docs
      - run: mix agendum.pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _build/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
